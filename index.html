<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CalCal">
<title>CalCal 飲食追蹤</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="logo">🍽</div>
  <p>連接中...</p>
</div>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="page-header">
    <div>
      <div class="page-title"><span id="home-ddmm"></span> <span id="sync-dot"></span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px;">v1.0.11</div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="openGoalModal()">⚙ 目標</button>
  </div>

  <div class="card" style="text-align:center;padding:20px 16px;">
    <div class="ring-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle class="ring-bg" cx="70" cy="70" r="57"/>
        <circle id="ring-cal" class="ring-fg" cx="70" cy="70" r="57" stroke="var(--accent)" stroke-dasharray="358.14" stroke-dashoffset="358.14"/>
      </svg>
      <div class="ring-label">
        <div id="ring-consumed-big" class="ring-cal">—</div>
        <div id="ring-goal-lbl" class="ring-sub"></div>
      </div>
    </div>
    <div class="macro-row">
      <div class="macro-item">
        <div class="macro-label"><span>蛋白質</span><span id="lbl-protein">—</span></div>
        <div class="macro-bar"><div id="bar-protein" class="macro-fill" style="background:var(--green);width:0%"></div></div>
      </div>
      <div class="macro-item">
        <div class="macro-label"><span>碳水</span><span id="lbl-carbs">—</span></div>
        <div class="macro-bar"><div id="bar-carbs" class="macro-fill" style="background:var(--yellow);width:0%"></div></div>
      </div>
      <div class="macro-item">
        <div class="macro-label"><span>脂肪</span><span id="lbl-fat">—</span></div>
        <div class="macro-bar"><div id="bar-fat" class="macro-fill" style="background:var(--orange);width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">飲水</div>
    <div class="water-bar-wrap">
      <div class="water-nums">
        <div><span id="water-consumed-big" class="water-consumed-big">0</span><span style="font-size:14px;color:var(--text2);margin-left:4px;">ml</span></div>
        <div id="water-goal-lbl" class="water-goal-txt"></div>
      </div>
      <div class="water-bar-track"><div id="water-bar-fill" class="water-bar-fill" style="width:0%"></div></div>
    </div>
    <div class="water-input-row">
      <div class="water-quick" onclick="addWaterQuick(500)">+500</div>
      <div class="water-quick" onclick="addWaterQuick(1500)">+1500</div>
      <input type="number" id="water-input" placeholder="自訂 ml" min="1">
      <button class="btn btn-danger btn-sm" onclick="resetWater()">↩</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">補充劑</div>
    <div id="supp-row" class="supp-row"></div>
    <div id="supp-empty" class="empty" style="padding:10px 0;display:none;"><p>尚未設定補充劑，請到⚙ 目標設定</p></div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>飲食記錄</span><span id="log-total-badge"></span>
    </div>
    <div id="log-list"></div>
    <div id="log-empty" class="empty" style="padding:16px 0;">
      <div class="empty-icon">🍽</div>
      <p>點擊下方「食物列表」添加飲食</p>
    </div>
  </div>
</div>

<!-- FOOD LISTS PAGE -->
<div id="page-lists" class="page">
  <div class="page-header">
    <div class="page-title">食物列表</div>
    <button class="btn btn-primary btn-sm" onclick="openAddFoodModal()">+ 添加食物</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;">
    <div style="flex:1;overflow:hidden;"><div id="list-tabs" class="list-tabs"></div></div>
    <button class="btn btn-secondary btn-sm" onclick="openManageListsModal()">管理</button>
  </div>
  <div id="food-grid"></div>
</div>

<!-- AI PAGE -->
<div id="page-ai" class="page">
  <div class="page-header"><div class="page-title">AI 識別</div></div>
  <div class="card">
    <div class="card-title">拍照識別食物營養</div>
    <div class="scan-area" onclick="document.getElementById('file-input').click()">
      <div style="font-size:48px;margin-bottom:8px;">📷</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:4px;">點擊上傳食物照片</div>
      <div style="font-size:13px;color:var(--text2);">AI 將分析食物名稱與營養成分</div>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)">
    <div id="ai-preview"></div>
    <div id="ai-result-box" style="display:none;" class="ai-result">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">識別結果</div>
      <div id="ai-stream" class="ai-stream"></div>
    </div>
    <div id="ai-action" style="display:none;margin-top:14px;"></div>
  </div>
  <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;font-size:12px;color:var(--text2);margin-top:8px;">
    💡 AI 識別結果僅供參考，建議核對實際營養標籤後再使用
  </div>
</div>

<!-- MODALS -->
<div id="modal-goal" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">每日目標設定</div>
    <div class="field-row">
      <div class="field"><label>卡路里 (kcal)</label><input type="number" id="g-cal" placeholder="2000"></div>
      <div class="field"><label>蛋白質 (g)</label><input type="number" id="g-protein" placeholder="150"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>碳水化合物 (g)</label><input type="number" id="g-carbs" placeholder="250"></div>
      <div class="field"><label>脂肪 (g)</label><input type="number" id="g-fat" placeholder="65"></div>
    </div>
    <div class="field"><label>飲水目標 (ml)</label><input type="number" id="g-water-ml" placeholder="2000"></div>
    <div class="field">
      <label>補充劑（用逗號分隔，例：魚油, 維他命D）</label>
      <input type="text" id="g-supps" placeholder="魚油, 維他命D, 鈣片">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-goal')">取消</button>
      <button class="btn btn-primary btn-full" onclick="saveGoals()">儲存</button>
    </div>
  </div>
</div>

<div id="modal-add-food" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="add-food-title">添加食物</div>
    <div class="field"><label for="f-name">食物名稱</label><input type="text" id="f-name" placeholder="例：雞胸肉"></div>
    <div class="field"><label for="f-ingredients">食材（選填）</label><input type="text" id="f-ingredients" placeholder="例：雞肉、白飯、醬汁"></div>
    <div class="field"><label for="f-list">所屬列表</label><select id="f-list"></select></div>
    <div class="field-row">
      <div class="field"><label for="f-cal">卡路里 (kcal)</label><input type="number" id="f-cal" min="0" step="any" placeholder="0"></div>
      <div class="field"><label for="f-protein">蛋白質 (g)</label><input type="number" id="f-protein" min="0" step="any" placeholder="未提供"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="f-carbs">碳水 (g)</label><input type="number" id="f-carbs" min="0" step="any" placeholder="未提供"></div>
      <div class="field"><label for="f-fat">脂肪 (g)</label><input type="number" id="f-fat" min="0" step="any" placeholder="未提供"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-add-food')">取消</button>
      <button id="save-food-btn" class="btn btn-primary btn-full" onclick="saveFood()">儲存</button>
    </div>
  </div>
</div>

<div id="modal-manage-lists" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">管理食物列表</div>
    <div class="field">
      <label>新增列表名稱</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="new-list-name" placeholder="例：早餐、蛋白質類">
        <button class="btn btn-primary btn-sm" onclick="addFoodList()">新增</button>
      </div>
    </div>
    <div id="manage-lists-items"></div>
    <button class="btn btn-secondary btn-full" style="margin-top:16px;" onclick="closeModal('modal-manage-lists')">完成</button>
  </div>
</div>

<div id="modal-serve" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="serve-food-name">選擇份量</div>
    <div id="serve-food-info" style="font-size:13px;color:var(--text2);margin-bottom:20px;"></div>
    <div class="field">
      <label>份量（×1 為食物名稱所示的一份）</label>
      <input type="number" id="serve-qty" value="1" min="0.1" step="0.1">
    </div>
    <div id="serve-preview" style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;"></div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-serve')">取消</button>
      <button class="btn btn-primary btn-full" onclick="confirmServe()">確認添加</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" data-page="home" onclick="switchPage('home',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>今日
  </button>
  <button class="nav-btn" data-page="lists" onclick="switchPage('lists',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>食物
  </button>
  <button class="nav-btn" data-page="ai" onclick="switchPage('ai',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>AI 識別
  </button>
</nav>

<!-- Firebase SDK -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
