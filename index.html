<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLog">
<title>FitLog 飲食追蹤</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #6c63ff;
    --accent2: #38bdf8;
    --green: #22d3a5;
    --red: #f87171;
    --orange: #fb923c;
    --yellow: #facc15;
    --text: #e8eaf0;
    --text2: #8b90a8;
    --text3: #5a5f7a;
    --radius: 16px;
    --radius-sm: 10px;
    padding-top: env(safe-area-inset-top, 0px);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: -webkit-fill-available; }
  html, body { background: var(--bg); color: var(--text); touch-action: manipulation; font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100vh; min-height: -webkit-fill-available; }

  /* NAV */
  .nav { display: flex; justify-content: space-around; align-items: center; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 0 34px; flex-shrink: 0; position: relative; z-index: 10; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 16px; border: none; background: none; color: var(--text2); font-size: 10px; cursor: pointer; transition: color .2s; -webkit-tap-highlight-color: transparent; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* PAGES */
  .page { display: none; flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .page.active { display: block; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }

  /* CARDS */
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
  .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 12px; }

  /* RING */
  .ring-wrap { position: relative; display: inline-block; margin-bottom: 8px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-cal { font-size: 24px; font-weight: 700; }
  .ring-sub { font-size: 11px; color: var(--text2); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
  .ring-fg { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }

  /* MACROS */
  .macro-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .macro-item { flex: 1; }
  .macro-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .macro-bar { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .macro-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }

  /* WATER */
  .water-bar-wrap { margin-bottom: 12px; }
  .water-bar-track { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .water-bar-fill { height: 100%; background: linear-gradient(90deg, #7dd3fc, var(--accent2)); border-radius: 99px; transition: width .4s ease; }
  .water-nums { display: flex; justify-content: space-between; align-items: baseline; }
  .water-consumed-big { font-size: 28px; font-weight: 700; color: var(--accent2); }
  .water-goal-txt { font-size: 12px; color: var(--text2); }
  .water-input-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .water-input-row input { flex: 1; min-width: 0; padding: 8px 10px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 16px; outline: none; -webkit-appearance: none; }
  .water-input-row input:focus { border-color: var(--accent2); }
  .water-quick { flex-shrink: 0; padding: 8px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all .2s; white-space: nowrap; }
  .water-quick:active { border-color: var(--accent2); color: var(--accent2); background: rgba(56,189,248,.1); }

  /* SUPPS */
  .supp-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .supp-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--border); font-size: 12px; cursor: pointer; transition: all .2s; -webkit-tap-highlight-color: transparent; background: var(--surface2); }
  .supp-chip.done { background: rgba(34,211,165,.15); border-color: var(--green); color: var(--green); }
  .supp-chip svg { width: 14px; height: 14px; }

  /* LOG */
  .log-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-name { font-size: 14px; font-weight: 500; }
  .log-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .log-cal { font-size: 14px; font-weight: 600; color: var(--accent); }
  .btn-icon { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; display: flex; align-items: center; -webkit-tap-highlight-color: transparent; }

  /* FOOD LISTS */
  .list-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
  .list-tabs::-webkit-scrollbar { display: none; }
  .list-tab { flex-shrink: 0; padding: 6px 14px; border-radius: 99px; border: 1.5px solid var(--border); font-size: 13px; cursor: pointer; background: var(--surface2); color: var(--text2); transition: all .2s; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .list-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,.12); }
  .food-item-wrap { position: relative; overflow: hidden; border-radius: var(--radius-sm); margin-bottom: 8px; }
  .food-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .food-item:active { background: var(--surface); }
  .food-name { font-size: 14px; font-weight: 500; }
  .food-macros { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .food-cal-badge { font-size: 13px; font-weight: 600; color: var(--accent); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; -webkit-tap-highlight-color: transparent; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: #5a52e0; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:active { background: var(--border); }
  .btn-danger { background: rgba(248,113,113,.15); color: var(--red); border: 1px solid var(--red); }
  .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 8px; }
  .btn-full { width: 100%; }
  .btn-row { display: flex; gap: 10px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: flex-end; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 100%; max-height: 90dvh; overflow-y: auto; animation: slideUp .25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 20px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

  /* FORM */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 16px; outline: none; -webkit-appearance: none; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  /* AI */
  .scan-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; transition: border-color .2s; -webkit-tap-highlight-color: transparent; }
  .scan-area:active { border-color: var(--accent); }
  #file-input { display: none; }
  .ai-result { background: var(--surface2); border-radius: var(--radius-sm); padding: 14px; margin-top: 14px; border: 1px solid var(--border); }
  .ai-stream { font-size: 13px; line-height: 1.6; white-space: pre-wrap; min-height: 40px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 12px; }

  /* MISC */
  .empty { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-icon { font-size: 40px; margin-bottom: 8px; }
  .empty p { font-size: 14px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-over { background: rgba(248,113,113,.15); color: var(--red); }

  /* SYNC STATUS */
  #sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); display: inline-block; margin-left: 6px; vertical-align: middle; transition: background .3s; }
  #sync-dot.ok { background: var(--green); }
  #sync-dot.err { background: var(--red); }
  #sync-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* LOADING SCREEN */
  #loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
  #loading-screen .logo { font-size: 48px; }
  #loading-screen p { color: var(--text2); font-size: 14px; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="logo">🍽</div>
  <p>連接中...</p>
</div>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="page-header">
    <div>
      <div class="page-title"><span id="home-ddmm"></span> <span id="sync-dot"></span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px;">v1.0.1</div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="openGoalModal()">⚙ 目標</button>
  </div>

  <div class="card" style="text-align:center;padding:20px 16px;">
    <div class="ring-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle class="ring-bg" cx="70" cy="70" r="57"/>
        <circle id="ring-cal" class="ring-fg" cx="70" cy="70" r="57" stroke="var(--accent)" stroke-dasharray="358.14" stroke-dashoffset="358.14"/>
      </svg>
      <div class="ring-label">
        <div id="ring-consumed-big" class="ring-cal">—</div>
        <div id="ring-goal-lbl" class="ring-sub"></div>
      </div>
    </div>
    <div class="macro-row">
      <div class="macro-item">
        <div class="macro-label"><span>蛋白質</span><span id="lbl-protein">—</span></div>
        <div class="macro-bar"><div id="bar-protein" class="macro-fill" style="background:var(--green);width:0%"></div></div>
      </div>
      <div class="macro-item">
        <div class="macro-label"><span>碳水</span><span id="lbl-carbs">—</span></div>
        <div class="macro-bar"><div id="bar-carbs" class="macro-fill" style="background:var(--yellow);width:0%"></div></div>
      </div>
      <div class="macro-item">
        <div class="macro-label"><span>脂肪</span><span id="lbl-fat">—</span></div>
        <div class="macro-bar"><div id="bar-fat" class="macro-fill" style="background:var(--orange);width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">飲水</div>
    <div class="water-bar-wrap">
      <div class="water-nums">
        <div><span id="water-consumed-big" class="water-consumed-big">0</span><span style="font-size:14px;color:var(--text2);margin-left:4px;">ml</span></div>
        <div id="water-goal-lbl" class="water-goal-txt"></div>
      </div>
      <div class="water-bar-track"><div id="water-bar-fill" class="water-bar-fill" style="width:0%"></div></div>
    </div>
    <div class="water-input-row">
      <div class="water-quick" onclick="addWaterQuick(500)">+500</div>
      <div class="water-quick" onclick="addWaterQuick(1500)">+1500</div>
      <input type="number" id="water-input" placeholder="自訂 ml" min="1">
      <button class="btn btn-danger btn-sm" onclick="resetWater()">↩</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">補充劑</div>
    <div id="supp-row" class="supp-row"></div>
    <div id="supp-empty" class="empty" style="padding:10px 0;display:none;"><p>尚未設定補充劑，請到⚙ 目標設定</p></div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>飲食記錄</span><span id="log-total-badge"></span>
    </div>
    <div id="log-list"></div>
    <div id="log-empty" class="empty" style="padding:16px 0;">
      <div class="empty-icon">🍽</div>
      <p>點擊下方「食物列表」添加飲食</p>
    </div>
  </div>
</div>

<!-- FOOD LISTS PAGE -->
<div id="page-lists" class="page">
  <div class="page-header">
    <div class="page-title">食物列表</div>
    <button class="btn btn-primary btn-sm" onclick="openAddFoodModal()">+ 添加食物</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;">
    <div style="flex:1;overflow:hidden;"><div id="list-tabs" class="list-tabs"></div></div>
    <button class="btn btn-secondary btn-sm" onclick="openManageListsModal()">管理</button>
  </div>
  <div id="food-grid"></div>
</div>

<!-- AI PAGE -->
<div id="page-ai" class="page">
  <div class="page-header"><div class="page-title">AI 識別</div></div>
  <div class="card">
    <div class="card-title">拍照識別食物營養</div>
    <div class="scan-area" onclick="document.getElementById('file-input').click()">
      <div style="font-size:48px;margin-bottom:8px;">📷</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:4px;">點擊上傳食物照片</div>
      <div style="font-size:13px;color:var(--text2);">AI 將分析食物名稱與營養成分</div>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)">
    <div id="ai-preview"></div>
    <div id="ai-result-box" style="display:none;" class="ai-result">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">識別結果</div>
      <div id="ai-stream" class="ai-stream"></div>
    </div>
    <div id="ai-action" style="display:none;margin-top:14px;"></div>
  </div>
  <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;font-size:12px;color:var(--text2);margin-top:8px;">
    💡 AI 識別結果僅供參考，建議核對實際營養標籤後再使用
  </div>
</div>

<!-- MODALS -->
<div id="modal-goal" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">每日目標設定</div>
    <div class="field-row">
      <div class="field"><label>卡路里 (kcal)</label><input type="number" id="g-cal" placeholder="2000"></div>
      <div class="field"><label>蛋白質 (g)</label><input type="number" id="g-protein" placeholder="150"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>碳水化合物 (g)</label><input type="number" id="g-carbs" placeholder="250"></div>
      <div class="field"><label>脂肪 (g)</label><input type="number" id="g-fat" placeholder="65"></div>
    </div>
    <div class="field"><label>飲水目標 (ml)</label><input type="number" id="g-water-ml" placeholder="2000"></div>
    <div class="field">
      <label>補充劑（用逗號分隔，例：魚油, 維他命D）</label>
      <input type="text" id="g-supps" placeholder="魚油, 維他命D, 鈣片">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-goal')">取消</button>
      <button class="btn btn-primary btn-full" onclick="saveGoals()">儲存</button>
    </div>
  </div>
</div>

<div id="modal-add-food" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="add-food-title">添加食物</div>
    <div class="field"><label>食物名稱</label><input type="text" id="f-name" placeholder="例：雞胸肉"></div>
    <div class="field"><label>所屬列表</label><select id="f-list"></select></div>
    <div class="field-row">
      <div class="field"><label>卡路里 (kcal)</label><input type="number" id="f-cal" placeholder="0"></div>
      <div class="field"><label>蛋白質 (g)</label><input type="number" id="f-protein" placeholder="0"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>碳水 (g)</label><input type="number" id="f-carbs" placeholder="0"></div>
      <div class="field"><label>脂肪 (g)</label><input type="number" id="f-fat" placeholder="0"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-add-food')">取消</button>
      <button class="btn btn-primary btn-full" onclick="saveFood()">儲存</button>
    </div>
  </div>
</div>

<div id="modal-manage-lists" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">管理食物列表</div>
    <div class="field">
      <label>新增列表名稱</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="new-list-name" placeholder="例：早餐、蛋白質類">
        <button class="btn btn-primary btn-sm" onclick="addFoodList()">新增</button>
      </div>
    </div>
    <div id="manage-lists-items"></div>
    <button class="btn btn-secondary btn-full" style="margin-top:16px;" onclick="closeModal('modal-manage-lists')">完成</button>
  </div>
</div>

<div id="modal-serve" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="serve-food-name">選擇份量</div>
    <div id="serve-food-info" style="font-size:13px;color:var(--text2);margin-bottom:20px;"></div>
    <div class="field">
      <label>份量（每份為 100g 基準）</label>
      <input type="number" id="serve-qty" value="1" min="0.1" step="0.1">
    </div>
    <div id="serve-preview" style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;"></div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-serve')">取消</button>
      <button class="btn btn-primary btn-full" onclick="confirmServe()">確認添加</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" data-page="home" onclick="switchPage('home',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>今日
  </button>
  <button class="nav-btn" data-page="lists" onclick="switchPage('lists',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>食物
  </button>
  <button class="nav-btn" data-page="ai" onclick="switchPage('ai',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>AI 識別
  </button>
</nav>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, getDocs, writeBatch, deleteDoc,
         initializeFirestore, persistentLocalCache, persistentMultipleTabManager }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── FIREBASE CONFIG ──────────────────────────────────────

const TODAY = () => new Date().toISOString().slice(0,10);
const syncDot = document.getElementById('sync-dot');
function setSyncStatus(s){ syncDot.className = s; }

// ── FIREBASE HELPERS ─────────────────────────────────────
const REF = {
  goals:     () => doc(db,'fitlog','goals'),
  foodLists: () => doc(db,'fitlog','foodLists'),
  foods:     () => doc(db,'fitlog','foods'),
  day:       (d) => doc(db,'days', d),
};

async function fbGet(ref){ try{ const s=await getDoc(ref); return s.exists()?s.data():null; }catch(e){return null;} }
async function fbSet(ref,data){ setSyncStatus('loading'); try{ await setDoc(ref,data); setSyncStatus('ok'); }catch(e){ setSyncStatus('err'); throw e; } }

// ── LOAD FROM FIREBASE ───────────────────────────────────
async function loadFromFirebase() {
  // goals
  const g = await fbGet(REF.goals());
  if(g) state.goals = g;

  // foodLists
  const fl = await fbGet(REF.foodLists());
  if(fl && fl.lists) state.foodLists = fl.lists;

  // foods
  const fo = await fbGet(REF.foods());
  if(fo && fo.foods) state.foods = fo.foods;

  // today's day doc
  const today = TODAY();
  const dayDoc = await fbGet(REF.day(today));
  if(dayDoc){
    if(dayDoc.logs)  state.logs[today]  = dayDoc.logs;
    if(dayDoc.water !== undefined) state.water[today] = dayDoc.water;
    if(dayDoc.supps) state.supps[today] = new Set(dayDoc.supps);
  }

  if(!state.activeListId && state.foodLists.length) state.activeListId = state.foodLists[0].id;

  // real-time listener for today
  onSnapshot(REF.day(today), snap => {
    if(!snap.exists()) return;
    const d = snap.data();
    if(d.logs)  state.logs[today]  = d.logs;
    if(d.water !== undefined) state.water[today] = d.water;
    if(d.supps) state.supps[today] = new Set(d.supps);
    renderHome();
  });

  setSyncStatus('ok');
}

// ── SAVE HELPERS ─────────────────────────────────────────
async function saveDayDoc(date){
  const suppsArr = Array.from(state.supps[date]||[]);
  await fbSet(REF.day(date), {
    logs:  state.logs[date]  || [],
    water: state.water[date] || 0,
    supps: suppsArr,
    updatedAt: Date.now(),
  });
}
async function saveGoalsDoc(){ await fbSet(REF.goals(), state.goals); }
async function saveFoodListsDoc(){ await fbSet(REF.foodLists(), {lists: state.foodLists}); }
async function saveFoodsDoc(){ await fbSet(REF.foods(), {foods: state.foods}); }

// ── COMPUTED ─────────────────────────────────────────────
function todayTotals(date){
  return (state.logs[date]||[]).reduce((a,l)=>({
    cal:a.cal+l.cal, protein:a.protein+l.protein, carbs:a.carbs+l.carbs, fat:a.fat+l.fat
  }),{cal:0,protein:0,carbs:0,fat:0});
}

// ── RENDER HOME ──────────────────────────────────────────
function renderHome(){
  const date=TODAY(), t=todayTotals(date), g=state.goals;
  const _now=new Date();
  const _dd=String(_now.getDate()).padStart(2,'0');
  const _mm=String(_now.getMonth()+1).padStart(2,'0');
  document.getElementById('home-ddmm').textContent=`${_dd}/${_mm}`;

  // Ring
  document.getElementById('ring-consumed-big').textContent = Math.round(t.cal);
  document.getElementById('ring-goal-lbl').textContent = `/ ${g.cal} kcal`;
  const pct=Math.min(1,t.cal/g.cal), circ=2*Math.PI*57;
  document.getElementById('ring-cal').style.strokeDashoffset = circ - circ*pct;
  document.getElementById('ring-cal').style.stroke = t.cal>g.cal?'var(--red)':'var(--accent)';

  // Macros
  const setBar=(id,val,goal,color)=>{
    const p=goal>0?Math.min(100,val/goal*100):0;
    document.getElementById('bar-'+id).style.width=p+'%';
    document.getElementById('bar-'+id).style.background=val>goal?'var(--red)':color;
    document.getElementById('lbl-'+id).textContent=`${Math.round(val)}/${goal}g`;
  };
  setBar('protein',t.protein,g.protein,'var(--green)');
  setBar('carbs',t.carbs,g.carbs,'var(--yellow)');
  setBar('fat',t.fat,g.fat,'var(--orange)');

  // Water
  const wGoal=g.waterMl||2000, wCon=state.water[date]||0;
  document.getElementById('water-consumed-big').textContent=wCon;
  document.getElementById('water-goal-lbl').textContent=`目標 ${wGoal} ml (${(wGoal/1000).toFixed(1)}L)`;
  const wPct=Math.min(100,wCon/wGoal*100);
  document.getElementById('water-bar-fill').style.width=wPct+'%';
  document.getElementById('water-bar-fill').style.background=wCon>=wGoal
    ?'linear-gradient(90deg,var(--green),#34d399)'
    :'linear-gradient(90deg,#7dd3fc,var(--accent2))';

  // Supps
  const suppRow=document.getElementById('supp-row');
  const suppEmpty=document.getElementById('supp-empty');
  suppRow.innerHTML='';
  if(!g.supps||!g.supps.length){ suppEmpty.style.display=''; suppRow.style.display='none'; }
  else {
    suppEmpty.style.display='none'; suppRow.style.display='';
    const doneSet=state.supps[date]||new Set();
    g.supps.forEach(s=>{
      const chip=document.createElement('div');
      chip.className='supp-chip'+(doneSet.has(s)?' done':'');
      chip.innerHTML=(doneSet.has(s)
        ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
        :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>')+s;
      chip.onclick=()=>{
        if(!state.supps[date]) state.supps[date]=new Set();
        if(state.supps[date].has(s)) state.supps[date].delete(s); else state.supps[date].add(s);
        saveDayDoc(date); renderHome();
      };
      suppRow.appendChild(chip);
    });
  }

  // Log
  const logs=state.logs[date]||[];
  const logList=document.getElementById('log-list');
  const logEmpty=document.getElementById('log-empty');
  document.getElementById('log-total-badge').innerHTML=t.cal>0?`<span class="badge ${t.cal>g.cal?'badge-over':''}">${Math.round(t.cal)} kcal</span>`:'';
  if(!logs.length){ logEmpty.style.display=''; logList.innerHTML=''; return; }
  logEmpty.style.display='none';
  logList.innerHTML=logs.map((l,i)=>`
    <div class="log-item">
      <div>
        <div class="log-name">${l.name} <span style="font-size:11px;color:var(--text3)">×${l.qty}</span></div>
        <div class="log-meta">蛋白 ${l.protein.toFixed(1)}g · 碳水 ${l.carbs.toFixed(1)}g · 脂肪 ${l.fat.toFixed(1)}g</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="log-cal">${Math.round(l.cal)}</div>
        <button class="btn-icon" onclick="window._deleteLog('${date}',${i})">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`).join('');
}

// ── AI SCAN ───────────────────────────────────────────────
let _parsedFood=null;
window.handlePhotoUpload=evt=>{
  const file=evt.target.files[0]; if(!file)return; evt.target.value='';
  const reader=new FileReader();
  reader.onload=async e=>{
    const dataUrl=e.target.result;
    document.getElementById('ai-preview').innerHTML=`<img src="${dataUrl}" class="preview-img">`;
    const box=document.getElementById('ai-result-box');
    const stream=document.getElementById('ai-stream');
    const action=document.getElementById('ai-action');
    box.style.display=''; action.style.display='none';
    stream.innerHTML='<span class="spinner"></span> AI 正在識別食物...'; _parsedFood=null;

    // Use Claude API via fetch (works when hosted outside claude.ai)
    try {
      const base64=dataUrl.split(',')[1];
      const mediaType=file.type||'image/jpeg';
      const prompt=`你是一個專業的營養師。請分析這張食物圖片，識別食物名稱，並估算每100g的營養成分。請只回答JSON，不要其他文字：
{"name":"食物中文名稱","description":"食物簡短描述","cal":卡路里數字,"protein":蛋白質g數,"carbs":碳水g數,"fat":脂肪g數,"confidence":"high/medium/low"}`;

      // Try claude.use('sample') if inside claude.ai iframe
      let resultText='';
      if(typeof window.claude!=='undefined'){
        const sample=await window.claude.use('sample');
        if(sample){
          const res=await sample([{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:base64}},
            {type:'text',text:prompt}
          ]}],{modelTier:'default',cache:false});
          resultText=res.text;
        }
      }
      if(!resultText) throw new Error('AI 功能需在 Claude.ai 環境下使用，或請整合自己的 API key');

      const match=resultText.match(/\{[\s\S]*\}/);
      if(!match) throw new Error('無法解析回應');
      _parsedFood=JSON.parse(match[0]);

      stream.innerHTML=`
        <div style="margin-bottom:8px;font-weight:600;font-size:15px;">🍽 ${_parsedFood.name}</div>
        <div style="color:var(--text2);font-size:12px;margin-bottom:12px;">${_parsedFood.description||''}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div style="background:rgba(108,99,255,.1);border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:var(--accent)">${_parsedFood.cal}</div><div style="font-size:11px;color:var(--text2)">卡路里/100g</div></div>
          <div style="background:rgba(34,211,165,.1);border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:var(--green)">${_parsedFood.protein}g</div><div style="font-size:11px;color:var(--text2)">蛋白質/100g</div></div>
          <div style="background:rgba(250,204,21,.1);border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:var(--yellow)">${_parsedFood.carbs}g</div><div style="font-size:11px;color:var(--text2)">碳水/100g</div></div>
          <div style="background:rgba(251,146,60,.1);border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:var(--orange)">${_parsedFood.fat}g</div><div style="font-size:11px;color:var(--text2)">脂肪/100g</div></div>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--text3);">信心度: ${_parsedFood.confidence==='high'?'🟢 高':_parsedFood.confidence==='medium'?'🟡 中':'🔴 低'}</div>`;
      action.style.display='';
      action.innerHTML=`<div class="btn-row">
        <button class="btn btn-secondary btn-full" onclick="window._addAiToList()">+ 添加到食物列表</button>
        <button class="btn btn-primary btn-full" onclick="window._logAiDirect()">直接記錄今日</button>
      </div>`;
    } catch(err){
      stream.textContent='⚠ '+( err.message||'識別失敗');
    }
  };
  reader.readAsDataURL(file);
};
window._addAiToList=()=>{ if(_parsedFood) window.openAddFoodModal(_parsedFood); };
window._logAiDirect=async()=>{
  if(!_parsedFood)return;
  const date=TODAY();
  if(!state.logs[date]) state.logs[date]=[];
  state.logs[date].push({name:_parsedFood.name,qty:1,cal:_parsedFood.cal,protein:_parsedFood.protein,carbs:_parsedFood.carbs,fat:_parsedFood.fat,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});
  await saveDayDoc(date); switchPage('home',document.querySelector('[data-page="home"]')); renderHome();
};

  o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); });
});

// ── INIT ──────────────────────────────────────────────────
document.getElementById('water-input').addEventListener('keydown',e=>{ if(e.key==='Enter') window.addWater(); });

setSyncStatus('loading');
loadFromFirebase().then(()=>{
  document.getElementById('loading-screen').style.display='none';
  renderHome();
  renderFoodLists();
}).catch(err=>{
  setSyncStatus('err');
  document.getElementById('loading-screen').querySelector('p').textContent='連接失敗，請檢查網路';
  console.error(err);
});
</script>
</body>
</html>
